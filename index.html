<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Guardián de la Interfaz</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="contenedor">

        <header class="cabecera">
            <h1>El Guardián de la Interfaz</h1>
            <p class="subtitulo">
                Personaliza el aspecto de la página. Tus preferencias se recuerdan con cookies nativas.
            </p>
        </header>

       
        <div id="contenedor-bienvenida"></div>

       
        <form id="formulario-preferencias" class="tarjeta">
            <fieldset>
                <legend>Configuración de la interfaz</legend>

                <div class="campo">
                    <label for="nombre-usuario">Nombre de usuario</label>
                    <input type="text" id="nombre-usuario" name="nombre-usuario" placeholder="Escribe tu nombre"
                        autocomplete="off" maxlength="30">
                </div>

                <div class="campo">
                    <label for="color-fondo">Color de fondo de la página</label>
                    <input type="color" id="color-fondo" name="color-fondo" value="#eef1f7">
                </div>

                <div class="campo">
                    <label for="tema-visual">Tema visual</label>
                    <select id="tema-visual" name="tema-visual">
                        <option value="tema-claro">Modo Claro</option>
                        <option value="tema-oscuro">Modo Oscuro</option>
                    </select>
                </div>

               
                <div class="acciones">
                    <button type="button" id="btn-guardar" class="btn btn-primario">
                        Guardar Preferencias
                    </button>
                    <button type="button" id="btn-restablecer" class="btn btn-secundario">
                        Restablecer Interfaz
                    </button>
                </div>
            </fieldset>
        </form>

        <!-- Zona de avisos para el usuario (no usamos alert) -->
        <p id="mensaje-estado" class="mensaje" role="status" aria-live="polite"></p>

        <section class="tarjeta panel-cookies">
            <h3>Cookies activas en este navegador</h3>
            <pre id="volcado-cookies">(ninguna)</pre>
        </section>

    </main>

  
    <script src="script.js"></script>
</body>

</html>
